[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cast-client"
version = "0.1.0"
description = "Cast / FHIRcast Python client for hub subscribers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "aiohttp>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]
